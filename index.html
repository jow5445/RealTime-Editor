<!doctypehtml><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Real-Time Editor</title><style>@import url(https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body,html{width:100%;height:100%}body{display:flex;overflow:hidden;background:#1e1e1e;font-family:'Open Sans',sans-serif}.editor{width:50%;height:100vh;display:flex;flex-direction:column;background:#1e1e1e}.panel{height:33.333%;display:flex;flex-direction:column;min-height:0;border-bottom:1px solid #333}.panel:last-child{border-bottom:none}.header{height:34px;min-height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;background:#252526;border-bottom:1px solid #333;color:#aaa;font-size:12px;font-weight:600;user-select:none}.name{display:flex;align-items:center}.name span{margin-right:7px}.html{color:#c51818}.download{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border:none;border-radius:4px;background:0 0;color:#888;cursor:pointer;transition:background .15s ease,color .15s ease}.download:hover{background:#333;color:#ddd}.download:active{background:#3a3a3a}.download svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}textarea{width:100%;height:calc(100% - 34px);padding:12px 14px;border:none;outline:0;resize:none;background:#1e1e1e;color:#d4d4d4;font-family:SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:14px;line-height:1.6;tab-size:4;overflow:auto}textarea:focus{background:#202020}textarea::placeholder{color:#555}textarea::-webkit-scrollbar{width:8px}textarea::-webkit-scrollbar-track{background:#1e1e1e}textarea::-webkit-scrollbar-thumb{background:#444}textarea::-webkit-scrollbar-thumb:hover{background:#555}.preview{width:50%;height:100vh;display:flex;flex-direction:column;background:#fff}.preview-header{height:34px;min-height:34px;display:flex;align-items:center;padding:0 12px;background:#f5f5f5;border-bottom:1px solid #ddd;color:#555;font-size:12px;font-weight:600;user-select:none}#viewer{width:100%;height:calc(100% - 34px);border:none;background:#fff}</style><script crossorigin=anonymous integrity="sha512-tTsZnBXEzNdEaqUO9Ok8fUofS73xieiBa54pD/sxOSvayIgItM9MmEM0CnUjA13LDnJT22sfwmjf20+Bo2174g=="src=https://cdnjs.cloudflare.com/ajax/libs/split.js/1.0.0/split.min.js></script><div class="split editor"><div class=panel><div class=header><div class=name><span class=html></span> HTML</div><button aria-label="Download HTML"class=download onclick='download("htmlCode","index.html")'title="Download HTML"><svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></button></div><label for=htmlCode></label><textarea id=htmlCode oninput=update() onkeydown=handleTab(event) placeholder="Write HTML here..."spellcheck=false></textarea></div><div class=panel><div class=header><div class=name>CSS</div><button aria-label="Download CSS"class=download onclick='download("cssCode","style.css")'title="Download CSS"><svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></button></div><label for=cssCode></label><textarea id=cssCode oninput=update() onkeydown=handleTab(event) placeholder="Write CSS here..."spellcheck=false></textarea></div><div class=panel><div class=header><div class=name>JavaScript</div><button aria-label="Download JavaScript"class=download onclick='download("javascriptCode","script.js")'title="Download JavaScript"><svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></button></div><label for=javascriptCode></label><textarea id=javascriptCode oninput=update() onkeydown=handleTab(event) placeholder="Write JavaScript here..."spellcheck=false></textarea></div></div><div class="split preview"><div class=preview-header>Preview</div><iframe id=viewer></iframe></div><script>function update() {
    const html = document.getElementById("htmlCode").value;
    const css = document.getElementById("cssCode").value;
    const js = document.getElementById("javascriptCode").value;

    const code =
        html +
        "<style>" +
        css +
        "</style>" +
        "<scri" +
        "pt>" +
        js +
        "</scri" +
        "pt>";

    const frame = document.getElementById("viewer").contentWindow.document;

    frame.open();
    frame.write(code);
    frame.close();
}

function handleTab(event) {
    if (event.key === "Tab") {
        event.preventDefault();

        const textarea = event.target;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;

        textarea.value =
            textarea.value.substring(0, start) +
            "\t" +
            textarea.value.substring(end);

        textarea.selectionStart = textarea.selectionEnd = start + 1;

        update();
    }
}

function download(id, filename) {
    const code = document.getElementById(id).value;

    const blob = new Blob([code], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    link.click();

    URL.revokeObjectURL(url);
}

Split(
    [".editor", ".preview"],
    {
        sizes: [50, 50],
        minSize: [250, 250],
        gutterSize: 6,
        cursor: "ew-resize"
    }
);</script>
